<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anki科目別学習アプリの日別学習記録" />
    <title>Anki | 学習記録</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=0.108" />
    <script src="/config.js" defer></script>
    <script src="/history.js" type="module"></script>
  </head>
  <body class="history-body">
    <header class="site-header">
      <a class="brand" href="/">Anki</a>
      <div class="header-meta">
        <span class="app-version">v0.108</span>
        <a class="header-link" href="/">学習画面</a>
        <a class="header-link" href="/settings.html">設定</a>
        <a class="header-link" href="/changelog.html">更新情報</a>
      </div>
    </header>

    <main class="page history-page">
      <section class="history-heading">
        <p class="eyebrow">午前4時で日付を切替</p>
        <h1>日別の学習記録</h1>
        <p>解いた問題数と学習時間を、科目・デッキ・学習方法ごとに表示します。</p>
      </section>

      <section class="history-status" id="history-status" aria-live="polite">
        Cloudflareから学習記録を読み込んでいます。
      </section>
      <div class="history-list is-hidden" id="history-list"></div>
    </main>
  </body>
</html>
