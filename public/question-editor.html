<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anki | 問題を編集</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme.js?v=0.237"></script>
    <link rel="stylesheet" href="/styles.css?v=0.237" />
    <link rel="stylesheet" href="/theme.css?v=0.237" />
    <link rel="stylesheet" href="/question-editor.css?v=0.237" />
    <script src="/config.js" defer></script>
    <script src="/question-editor.js?v=0.237" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Anki</a>
      <div class="header-meta">
        <span class="app-version">v0.237</span>
        <button class="header-link theme-toggle" type="button" data-theme-toggle>ダークモードへ</button>
        <a class="header-link" href="/settings.html">設定</a>
        <a class="header-link" id="return-to-study" href="/">開始画面へ戻る</a>
      </div>
    </header>
    <main class="page editor-page">
      <div class="editor-heading">
        <div><p class="eyebrow" id="editor-subject">問題の管理</p><h1>問題を編集</h1></div>
        <button class="secondary-button" id="reload-editor" type="button">再読込</button>
      </div>
      <p class="editor-intro">問題を選んで編集するか、新しい問題を追加してください。保存した内容は、ほかの端末にも反映されます。</p>
      <div class="editor-notice" role="status" aria-live="polite">
        <span id="editor-status">問題を読み込んでいます。</span>
        <button class="secondary-button" id="undo-delete" type="button" hidden>削除を元に戻す</button>
      </div>
      <div class="editor-layout" id="editor-layout">
        <section class="editor-list-panel" aria-label="問題一覧">
          <div class="editor-filters">
            <label>デッキ<select id="editor-deck" disabled><option>読込中</option></select></label>
            <label>問題を検索<input id="editor-search" type="search" placeholder="問題文・回答・用語で検索" maxlength="200" disabled /></label>
            <label>分類<select id="editor-category" disabled><option value="">すべての分類</option></select></label>
            <button class="primary-button" id="add-question" type="button" disabled>＋ 問題を追加</button>
          </div>
          <p id="editor-count" class="editor-muted"></p>
          <div id="question-list" class="question-list"></div>
          <div class="editor-pagination">
            <button class="secondary-button" id="previous-page" type="button" disabled>前へ</button>
            <span id="page-position"></span>
            <button class="secondary-button" id="next-page" type="button" disabled>次へ</button>
          </div>
        </section>
        <section class="editor-form-panel" aria-label="問題の入力">
          <p id="editor-placeholder" class="editor-muted">一覧から問題を選ぶと、ここで編集できます。</p>
          <form id="question-form" hidden>
            <div class="editor-form-heading"><h2 id="form-title" tabindex="-1">問題を編集</h2><button class="secondary-button" id="close-form" type="button">一覧へ戻る</button></div>
            <fieldset id="editor-fields">
              <label>所属デッキ<select name="targetDeckId" id="target-deck" required></select></label>
              <label>問題文<span class="editor-required">必須</span><textarea name="prompt" rows="4" maxlength="20000" required></textarea></label>
              <label>回答<span class="editor-required">必須</span><textarea name="answer" rows="3" maxlength="20000" required></textarea></label>
              <label>解説<textarea name="explanation" rows="4" maxlength="20000"></textarea></label>
              <p id="explanation-help" class="editor-muted" hidden></p>
              <details id="editor-details">
                <summary>詳細設定</summary>
                <p id="shared-term-note" class="editor-muted"></p>
                <label>用語・見出し<input name="term" maxlength="500" /></label>
                <label><span id="category-label">分類</span><input name="category" maxlength="500" list="category-suggestions" /></label>
                <datalist id="category-suggestions"></datalist>
                <label id="macro-region-field"><span id="macro-region-label">大分類</span><input name="macroRegion" maxlength="500" /></label>
                <label id="region-detail-field"><span id="region-detail-label">小分類</span><input name="regionDetail" maxlength="500" /></label>
                <label>問題形式<select name="stage" id="question-stage"></select></label>
                <label>別の正答（１行に１つ）<textarea name="acceptedAnswers" rows="2" maxlength="20000"></textarea></label>
                <label>回答の補足<textarea name="answerNote" rows="3" maxlength="20000"></textarea></label>
                <label>語呂合わせ<textarea name="yearMnemonic" rows="2" maxlength="20000"></textarea></label>
              </details>
              <div class="editor-save-actions">
                <button class="primary-button" type="submit" id="save-question">保存</button>
                <button class="secondary-button" id="cancel-edit" type="button">キャンセル</button>
                <span id="dirty-status" class="editor-muted" role="status"></span>
              </div>
              <div class="editor-delete-actions"><button class="secondary-button editor-danger" id="delete-question" type="button">この問題を削除</button></div>
            </fieldset>
          </form>
        </section>
      </div>
      <dialog id="editor-confirm">
        <form method="dialog">
          <h2 id="confirm-title"></h2><p id="confirm-message"></p>
          <div class="editor-confirm-actions"><button class="secondary-button" value="cancel" autofocus>キャンセル</button><button class="primary-button" id="confirm-proceed" value="proceed">続ける</button></div>
        </form>
      </dialog>
    </main>
  </body>
</html>
