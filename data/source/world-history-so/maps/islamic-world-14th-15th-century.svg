<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">14〜15世紀のイスラーム世界・地図穴埋め</title>
  <desc id="desc">地図上の①から⑩をすべて答えなさい。赤い塗り、縦線、斜線、黒い点線で各勢力の範囲を示し、都市は黒い丸で示す。</desc>
