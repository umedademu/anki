<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anki世界史学習アプリの復習・音声設定" />
    <title>Anki | 設定</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=0.029" />
    <script src="/config.js" defer></script>
    <script src="/settings.js" type="module"></script>
  </head>
  <body class="settings-body">
    <header class="site-header">
      <a class="brand" href="/">Anki</a>
      <div class="header-meta">
        <span class="app-version">v0.029</span>
        <a class="header-link" href="/changelog.html">更新情報</a>
        <a class="header-link" href="/">学習画面へ戻る</a>
      </div>
    </header>

    <main class="page settings-page">
      <section class="settings-heading">
        <p class="eyebrow">設定</p>
        <h1>復習と音声読み上げ</h1>
        <p>復習間隔と、学習中に使用する日本語音声を設定します。</p>
      </section>

      <section class="settings-card">
        <h2>Cloudflareへの接続</h2>
        <p class="settings-description">
          学習記録と設定はCloudflare上の一人用データへ保存します。新しい端末では、同じアクセスキーを一度入力してください。
        </p>
        <label class="access-key-field" for="access-key">
          <span>アクセスキー</span>
          <input id="access-key" type="password" autocomplete="current-password" />
        </label>
        <button class="secondary-button settings-connect" id="connect-cloud" type="button">
          接続を確認
        </button>
      </section>

      <section class="settings-card speech-settings-card">
        <h2>音声読み上げ</h2>
        <p class="settings-description">
          自然さを優先するAzure音声と、この端末で利用できる日本語音声を選択できます。選択内容と速度はCloudflareへ保存し、端末間で共有します。
        </p>
        <div class="speech-settings-list">
          <label class="speech-setting-row" for="speech-source">
            <span>優先する音声</span>
            <select id="speech-source">
              <option value="cloud">Azure音声（自然さ優先）</option>
              <option value="device">端末内音声（通信不要）</option>
            </select>
          </label>
          <label class="speech-setting-row" for="azure-voice">
            <span>Azure音声</span>
            <select id="azure-voice"></select>
          </label>
          <label class="speech-setting-row" for="device-voice">
            <span>端末音声</span>
            <select id="device-voice" aria-describedby="device-voice-note"></select>
          </label>
          <p class="settings-description speech-setting-note" id="device-voice-note">
            共有された端末音声がこの端末にない場合は、この端末の推奨日本語音声を使用します。
          </p>
          <label class="speech-setting-row" for="speech-rate">
            <span>読み上げ速度 <output id="speech-rate-output">1.00倍</output></span>
            <input id="speech-rate" type="range" min="0.7" max="1.2" step="0.05" value="1" />
          </label>
        </div>
        <div class="speech-setting-actions">
          <button class="secondary-button" id="preview-speech" type="button">選んだ音声を試す</button>
          <button class="primary-button" id="save-speech-settings" type="button">音声設定を保存</button>
        </div>
        <p class="speech-settings-status" id="speech-settings-status" role="status"></p>
      </section>

      <form class="settings-card" id="review-settings-form">
        <h2>次の復習までの時間</h2>
        <div class="interval-list">
          <label class="interval-row rating-incorrect-row">
            <strong>× 不正解</strong>
            <input id="again-value" type="number" min="1" step="1" required />
            <select id="again-unit" aria-label="不正解の時間単位">
              <option value="1">秒</option>
              <option value="60">分</option>
              <option value="3600">時間</option>
              <option value="86400">日</option>
            </select>
          </label>
          <label class="interval-row rating-hard-row">
            <strong>△ 難しい</strong>
            <input id="hard-value" type="number" min="1" step="1" required />
            <select id="hard-unit" aria-label="難しいの時間単位">
              <option value="1">秒</option>
              <option value="60">分</option>
              <option value="3600">時間</option>
              <option value="86400">日</option>
            </select>
          </label>
          <label class="interval-row rating-good-row">
            <strong>○ 正解</strong>
            <input id="good-value" type="number" min="1" step="1" required />
            <select id="good-unit" aria-label="正解の時間単位">
              <option value="1">秒</option>
              <option value="60">分</option>
              <option value="3600">時間</option>
              <option value="86400">日</option>
            </select>
          </label>
          <label class="interval-row rating-easy-row">
            <strong>◎ 簡単</strong>
            <input id="easy-value" type="number" min="1" step="1" required />
            <select id="easy-unit" aria-label="簡単の時間単位">
              <option value="1">秒</option>
              <option value="60">分</option>
              <option value="3600">時間</option>
              <option value="86400">日</option>
            </select>
          </label>
        </div>
        <button class="primary-button settings-save" id="save-settings" type="submit">
          復習間隔を保存
        </button>
      </form>

      <p class="settings-status" id="settings-status" role="status"></p>
    </main>
  </body>
</html>
