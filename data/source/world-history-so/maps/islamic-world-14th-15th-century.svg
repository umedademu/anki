    <pattern id="vertical" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#e2e1d8"/>
      <path d="M2 0V9M6 0V9" stroke="#62645d" stroke-width="1.6"/>
    </pattern>
    <pattern id="diagonal" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="11" height="11" fill="#e3e2da"/>
      <path d="M2 0V11M7 0V11" stroke="#666860" stroke-width="1.7"/>
    </pattern>
    <pattern id="printDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e8aaa6"/>
      <circle cx="2" cy="2" r="0.7" fill="#cf6868" opacity=".45"/>
      <circle cx="6" cy="6" r="0.7" fill="#cf6868" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1120" height="650" fill="#faf9f4"/>

